<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todogram Logo Concepts</title>
  <style>
    body { margin:0; font-family: 'Inter', 'Pretendard', system-ui, sans-serif; background:#f4f7fb; color:#191f28; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 36px 20px 48px; }
    h1 { margin:0 0 8px; font-size: 28px; }
    p { margin:0 0 24px; color:#6b7684; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px; }
    .card { background:white; border:1px solid #e6ebf2; border-radius:20px; padding:18px; box-shadow: 0 8px 18px rgba(15,23,42,0.06); }
    .logo { width:96px; height:96px; border-radius:24px; display:block; }
    .name { margin-top:12px; font-weight:700; }
    .path { margin-top:6px; font-size:12px; color:#6b7684; word-break:break-all; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Todogram Modern Logo Concepts</h1>
    <p>Codex/GPT/Gemini ?? ??? ?? ??? ?? ?????.</p>
    <section class="grid">
      <article class="card">
        <img class="logo" src="/todogram-logo-modern-orbit.svg" alt="Modern Orbit" />
        <div class="name">Modern Orbit</div>
        <div class="path">/todogram-logo-modern-orbit.svg</div>
      </article>
      <article class="card">
        <img class="logo" src="/todogram-logo-modern-weave.svg" alt="Modern Weave" />
        <div class="name">Modern Weave</div>
        <div class="path">/todogram-logo-modern-weave.svg</div>
      </article>
      <article class="card">
        <img class="logo" src="/todogram-logo-modern-core.svg" alt="Modern Core" />
        <div class="name">Modern Core</div>
        <div class="path">/todogram-logo-modern-core.svg</div>
      </article>
    </section>
  </main>
</body>
</html>
