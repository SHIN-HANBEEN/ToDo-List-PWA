<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Todogram Toss Style Logo</title>
  <desc id="desc">Rounded blue tile with white check and dynamic orbit accents.</desc>
  <defs>
    <linearGradient id="bg" x1="32" y1="28" x2="226" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#1B64DA"/>
    </linearGradient>
    <linearGradient id="shine" x1="80" y1="58" x2="198" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.72"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="12" y="10" width="232" height="236" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1B64DA" flood-opacity="0.26"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="28" y="24" width="200" height="208" rx="58" fill="url(#bg)"/>
  </g>

  <path d="M76 84C104 54 152 50 184 73" stroke="url(#shine)" stroke-width="16" stroke-linecap="round"/>
  <path d="M96 132L124 160L174 102" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="194" cy="95" r="12" fill="white" fill-opacity="0.22"/>
  <circle cx="64" cy="178" r="10" fill="white" fill-opacity="0.18"/>
</svg>
